<!doctype html><html lang=tr><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>99 Soruda Kur'an'ı Ne Kadar Tanıyorsun? · Ayetlerden Dersler</title>
<meta name=description content="Her soruda bir bilgi, her ayette bir ders. 6 bölüm, 99 soru, Diyanet mealiyle.">
<link rel=icon href=../icon.svg>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Serif+4&display=swap" rel=stylesheet>
<style>
:root{--navy:#0b1f4d;--blue:#1d4ed8;--red:#c8102e;--ink:#1e293b;--mut:#64748b;--ok:#15803d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#eef3ff,#fff 45%,#fff5f6);min-height:100vh}
a{color:var(--blue)}.wrap{max-width:760px;margin:0 auto;padding:16px}
header{background:var(--blue);color:#fff;border-bottom:4px solid var(--red);padding:22px 16px;text-align:center}
header h1{margin:0;font-size:clamp(1.3rem,4.5vw,2rem);font-weight:800}header p{margin:6px 0 0;opacity:.92;font-style:italic}
.back{display:inline-block;margin:10px 0 0;color:#fff;font-size:.85rem}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 28px rgba(29,78,216,.14);border-top:4px solid var(--red);margin:16px 0}
h2{margin:0 0 12px;color:var(--navy);font-size:1.2rem}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cats button,.btn{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--blue);background:#fff;color:var(--navy);padding:12px 14px;font-weight:700;text-align:left}
.cats button small{display:block;font-weight:500;color:var(--mut);margin-top:2px}
.cats button.all{grid-column:1/-1;background:var(--blue);color:#fff;text-align:center}.cats button.all small{color:#dbe4ff}.cats button.hz{background:var(--red);border-color:var(--red);font-size:1.08rem;padding:16px}.cats button.hz small{color:#ffe4e6}
.cats button:hover,.btn:hover{border-color:var(--red)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--mut);font-weight:600}
.bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--red));width:0;transition:width .35s}
.q{font-size:1.15rem;font-weight:700;color:var(--navy);line-height:1.4;margin:4px 0 14px}
.opts{display:grid;gap:10px}.opt{display:flex;gap:12px;align-items:flex-start;width:100%;font:inherit;text-align:left;cursor:pointer;background:#fff;border:2px solid #c7d4f5;border-radius:12px;padding:12px;color:var(--ink);transition:border-color .15s,background .15s}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e8eefc;color:var(--blue)}
.opt:hover:not(:disabled){border-color:var(--blue);background:#f5f8ff}.opt:disabled{cursor:default}
.opt.dogru{border-color:var(--ok);background:#ecfdf3}.opt.dogru b{background:var(--ok);color:#fff}
.opt.yanlis{border-color:var(--red);background:#fff1f2}.opt.yanlis b{background:var(--red);color:#fff}
.fb{margin-top:14px;display:none}.fb.on{display:block}
.res{font-weight:800;font-size:1.05rem}.res.ok{color:var(--ok)}.res.no{color:var(--red)}
.ozet{margin:8px 0}.lbl{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:#e8eefc;color:var(--blue);margin-bottom:4px}
blockquote{margin:8px 0;padding:10px 14px;border-left:4px solid var(--blue);background:#f1f5fb;border-radius:0 10px 10px 0;font-family:"Source Serif 4",Georgia,serif}
blockquote cite{display:block;font-family:Inter;font-style:normal;font-size:.75rem;font-weight:700;color:var(--red);margin-top:4px}
.not{font-size:.85rem;color:#7c2d12;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:8px 10px;margin-top:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn.p{background:var(--red);border-color:var(--red);color:#fff}.btn.b{background:var(--blue);color:#fff}
.big{font-size:3rem;font-weight:800;color:var(--blue);text-align:center;margin:6px 0}.stats{display:flex;justify-content:center;gap:18px;font-weight:700;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:.9rem}td,th{padding:7px;border-bottom:1px solid #e2e8f0;text-align:left}td:last-child,th:last-child{text-align:right}
.kbd{font-size:.75rem;color:var(--mut);margin-top:10px}.sr{position:absolute;left:-9999px}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:20px 16px}
@media(max-width:480px){.card{padding:16px}.q{font-size:1.05rem}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head><body>
<header><h1>🏆 99 Soruda Kur'an'ı Ne Kadar Tanıyorsun?</h1><p>Her soruda bir bilgi, her ayette bir ders.</p><a class=back href="../">← Ayetlerden Dersler</a></header>
<div class=wrap><main id=app aria-live=polite></main></div>
<footer>Ayet metinleri Diyanet mealinden (tr.diyanet) birebir alınmıştır. Özetler ve yanlış seçenekler bize aittir. Dinî sorularınız için: Diyanet ALO 190.</footer>
<script src="sorular.js"></script>
<script>
(()=>{const K=window.KATEGORILER,S=window.SORULAR,app=document.getElementById('app'),L='ABCD';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let st=null;
function menu(){st=null;app.innerHTML=`<section class=card><h2>Bölüm seç</h2><div class=cats>
<button class="all hz" data-k=-2>⚡ Kendini Test Et – 10 soruluk hızlı yarışma<small>Her oyunda 99 sorudan karışık yeni 10 soru · 100 puan</small></button>
<button class=all data-k=-1>🏆 Hepsi birden<small>99 soru · 6 bölüm</small></button>
${K.map((k,i)=>`<button data-k=${i}>${i+1}. ${esc(k)}<small>${S.filter(s=>s.k===i).length} soru</small></button>`).join('')}</div>
<p class=kbd>Her doğru cevap 10 puan. Klavye: 1-4 veya A-D ile seç, Enter ile devam et.</p></section>`;
app.querySelectorAll('.cats button').forEach(b=>b.onclick=()=>start(+b.dataset.k));app.querySelector('.cats button').focus()}
function hizli(){const g=K.map((_,i)=>shuf(S.filter(s=>s.k===i))),o=shuf(K.map((_,i)=>i)),r=[];let j=0;while(r.length<10){const c=g[o[j%o.length]];if(c.length)r.push(c.pop());j++}return shuf(r)}
function start(k){const qs=k===-2?hizli():S.filter(s=>k<0||s.k===k);st={k,qs,i:0,ok:0,ans:[],per:K.map(()=>[0,0])};show()}
function show(){const s=st.qs[st.i];st.opts=shuf([s.a,...s.w]);st.done=false;const n=st.qs.length;
app.innerHTML=`<section class=card><div class=top><span>${st.k===-2?'⚡ Hızlı · ':''}${esc(K[s.k])}</span><span>Soru ${st.i+1}/${n} · Puan ${st.ok*10}</span></div>
<div class=bar role=progressbar aria-valuemin=0 aria-valuemax=${n} aria-valuenow=${st.i} aria-label="İlerleme"><i style="width:${st.i/n*100}%"></i></div>
<p class=q id=qt>${s.no}. ${esc(s.q)}</p><div class=opts role=group aria-labelledby=qt>${st.opts.map((o,i)=>`<button class=opt data-i=${i}><b>${L[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
<div class=fb id=fb></div><p class=kbd>1-4 / A-D: seç · Enter: sonraki</p></section>`;
app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));app.querySelector('.opt').focus()}
function pick(i){if(st.done)return;st.done=true;const s=st.qs[st.i],ok=st.opts[i]===s.a;st.per[s.k][1]++;if(ok){st.ok++;st.per[s.k][0]++}
app.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(st.opts[j]===s.a)b.classList.add('dogru');else if(j===i)b.classList.add('yanlis')});
const fb=document.getElementById('fb');const last=st.i===st.qs.length-1;
fb.innerHTML=`<p class=res ${ok?'ok':'no'}>${ok?'✅ Doğru! +10 puan':'❌ Yanlış. Doğru cevap: '+esc(s.a)}</p>
<div class=ozet><span class=lbl>Kısa açıklama</span><div>${esc(s.ozet)}</div></div>
${s.meal.length?`<span class=lbl>Diyanet meali · ${esc(s.ref)}</span>`+s.meal.map(m=>`<blockquote>${esc(m.t)}<cite>${esc(m.r)} – Diyanet meali</cite></blockquote>`).join(''):`<span class=lbl>Bilgi · ayet değildir</span>`}
${s.not?`<div class=not><b>Not:</b> ${esc(s.not)}</div>`:''}
<div class=row><button class="btn b" id=nx>${last?'Sonucu gör':'Sonraki soru'} →</button><button class=btn id=mn>Bölümler</button></div>`;
fb.classList.add('on');document.getElementById('nx').onclick=next;document.getElementById('mn').onclick=menu;document.getElementById('nx').focus()}
function next(){if(!st.done)return;st.i++;if(st.i<st.qs.length)show();else end()}
function end(){const n=st.qs.length,p=Math.round(st.ok/n*100);
app.innerHTML=`<section class=card><h2>🎉 ${st.k===-2?"Hızlı Yarışma Sonucu":"Sonuç"}</h2><div class=big>${st.ok*10}${st.k===-2?" / 100":" puan"}</div>
<div class=stats><span style="color:var(--ok)">✅ ${st.ok} doğru</span><span style="color:var(--red)">❌ ${n-st.ok} yanlış</span><span>📊 %${p} başarı</span></div>
<table><thead><tr><th>Bölüm</th><th>Puan</th></tr></thead><tbody>${st.per.map((v,i)=>v[1]?`<tr><td>${esc(K[i])}</td><td>${v[0]*10} / ${v[1]*10}</td></tr>`:'').join('')}</tbody></table>
<div class=row><button class="btn p" id=again>${st.k===-2?"⚡ Yeni 10 soru":"🔁 Tekrar oyna"}</button><button class="btn b" id=share>📤 Paylaş</button><button class=btn id=mn>Bölümler</button></div><p id=msg class=kbd></p></section>`;
document.getElementById('again').onclick=()=>start(st.k);document.getElementById('mn').onclick=menu;
document.getElementById('share').onclick=async()=>{const t=`99 Soruda Kur'an'da ${st.ok*10} puan aldım (%${p})! Sen de dene:`,u=location.href.split('#')[0];
try{if(navigator.share){await navigator.share({title:"99 Soruda Kur'an",text:t,url:u});return}await navigator.clipboard.writeText(t+' '+u);document.getElementById('msg').textContent='Bağlantı kopyalandı.'}catch(e){document.getElementById('msg').textContent='Bağlantı: '+u}};
document.getElementById('again').focus()}
addEventListener('keydown',e=>{if(!st||e.ctrlKey||e.metaKey||e.altKey)return;const m={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3}[e.key.toLowerCase()];
if(m!==undefined&&!st.done&&st.i<st.qs.length&&document.querySelector('.opt')){e.preventDefault();pick(m)}
else if(e.key==='Enter'&&st.done&&document.getElementById('nx')&&document.activeElement.id!=='mn'&&document.activeElement.id!=='nx'){e.preventDefault();next()}});
addEventListener('hashchange',()=>{if(location.hash==='#hizli')start(-2)});if(location.hash==='#hizli')start(-2);else menu()})();
</script></body></html>
